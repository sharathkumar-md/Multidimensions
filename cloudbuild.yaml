steps:
  # 1. Build the API Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-api:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-api:latest'
      - '-f'
      - '05_api/Dockerfile'
      - '.'

  # 2. Push the API image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-api:$COMMIT_SHA'

  # 3. Deploy API to Cloud Run via YAML specification
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat <<EOF > service.yaml
        apiVersion: serving.knative.dev/v1
        kind: Service
        metadata:
          name: multidimensions-api
          labels:
            cloud.googleapis.com/location: asia-southeast1
        spec:
          template:
            metadata:
              annotations:
                autoscaling.knative.dev/maxScale: '1'
                autoscaling.knative.dev/minScale: '1'
                run.googleapis.com/gpu-zonal-redundancy-disabled: 'true'
                run.googleapis.com/cloudsql-instances: 'sales-assistant-multid:us-central1:multidimensions-db'
            spec:
              containerConcurrency: 1
              timeoutSeconds: 900
              nodeSelector:
                run.googleapis.com/accelerator: nvidia-l4
              containers:
              - image: us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-api:$COMMIT_SHA
                ports:
                - containerPort: 8000
                env:
                - name: API_DATABASE_URL
                  value: "postgresql+asyncpg://postgres:B.%244y%40s%22vUb%5Btj%3Eh@/multidimensions?host=/cloudsql/sales-assistant-multid:us-central1:multidimensions-db"
                resources:
                  limits:
                    cpu: '8000m'
                    memory: '32Gi'
                    nvidia.com/gpu: '1'
                startupProbe:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 0
                  timeoutSeconds: 240
                  periodSeconds: 240
                  failureThreshold: 4
        EOF
        gcloud run services replace service.yaml --region=asia-southeast1 --quiet

  # 4. Build the Frontend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-frontend:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-frontend:latest'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://multidimensions-api-571181295708.asia-southeast1.run.app'
      - '-f'
      - '06_frontend/Dockerfile'
      - './06_frontend'

  # 5. Push the Frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-frontend:$COMMIT_SHA'

  # 6. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy multidimensions-frontend \
          --image=us-central1-docker.pkg.dev/$PROJECT_ID/multidimensions/sales-assistant-frontend:$COMMIT_SHA \
          --region=asia-southeast1 \
          --platform=managed \
          --port=3000 \
          --allow-unauthenticated \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY
