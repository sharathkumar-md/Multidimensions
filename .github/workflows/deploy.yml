name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

# Requires the CI pipeline (ci.yml) to have passed on the same commit.
# In production, add: needs: [ci] if running as a reusable workflow.

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # needed for Workload Identity Federation (alternative to SA key)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push Docker image via Cloud Build
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ secrets.GCP_PROJECT }}/multidimensions-rag:${{ github.sha }} \
            --timeout=3600s

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy multidimensions-rag \
            --image gcr.io/${{ secrets.GCP_PROJECT }}/multidimensions-rag:${{ github.sha }} \
            --region us-central1 \
            --platform managed \
            --memory 16Gi \
            --cpu 8 \
            --gpu 1 \
            --gpu-type nvidia-l4 \
            --max-instances 3 \
            --min-instances 0 \
            --port 8080 \
            --timeout 600 \
            --set-env-vars RAG_AUTH_ENABLED=true \
            --update-secrets \
              RAG_KEYCLOAK_CLIENT_SECRET=keycloak-client-secret:latest,\
              RAG_AUTH_SESSION_KEY=rag-session-key:latest,\
              HF_TOKEN=hf-token:latest,\
              RAG_KEYCLOAK_SERVER_URL=keycloak-server-url:latest,\
              RAG_KEYCLOAK_REALM=keycloak-realm:latest,\
              RAG_KEYCLOAK_CLIENT_ID=keycloak-client-id:latest,\
              RAG_APP_BASE_URL=app-base-url:latest \
            --allow-unauthenticated

      - name: Print deployment URL
        run: |
          URL=$(gcloud run services describe multidimensions-rag \
            --region us-central1 \
            --format='value(status.url)')
          echo "✅ Deployed to: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
