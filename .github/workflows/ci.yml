name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: |
          ruff check 03_rag/src/ 04_demo/ \
            --select E,W,F,I \
            --ignore E501 \
            --output-format github

  # ── Job 2: Security Scan ─────────────────────────────────────────────────────
  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r 03_rag/src/ 04_demo/ \
            -ll \
            --exit-zero \
            -f txt

  # ── Job 3: Unit Tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    # Tests requiring GPU or large models cannot run in CI.
    # This job validates configuration, utilities, and non-GPU logic.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          pip install \
            pytest \
            pytest-cov \
            pydantic \
            pydantic-settings \
            loguru \
            duckduckgo-search \
            diskcache \
            authlib \
            "PyJWT[crypto]"

      - name: Run tests (non-GPU)
        working-directory: 03_rag
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --tb=short -x \
              --ignore=tests/test_rag_live.py \
              -m "not gpu and not slow" \
              2>&1
          else
            echo "No non-GPU unit tests found — skipping."
          fi
