version: "3.9"

services:
  keycloak-db:
    image: postgres:15-alpine
    container_name: multidimensions-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: multidimensions-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: 05_api/Dockerfile
    container_name: multidimensions-api
    ports:
      - "8000:8000"
    environment:
      API_AUTH_ENABLED: "true"
      API_KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      API_CORS_ORIGINS: "http://localhost:3000"
    volumes:
      - ./data:/app/data
      - ./03_rag/index:/app/03_rag/index
      - ./.sessions.json:/app/.sessions.json
      - ./logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute, utility]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./06_frontend
      dockerfile: Dockerfile
    container_name: multidimensions-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXTAUTH_URL: "http://localhost:3000"
      AUTH_SECRET: "super_secret_key_for_development_only"
      KEYCLOAK_CLIENT_ID: "rag-sales-bot"
      KEYCLOAK_CLIENT_SECRET: "my_client_secret"
      KEYCLOAK_ISSUER: "http://localhost:8081/realms/multidimensions"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  keycloak_data:
