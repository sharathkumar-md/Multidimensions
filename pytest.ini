[pytest]
# Each sub-module (01_ocr, 02_llm_eval, 03_rag) has its own conftest.py that
# adds the module root to sys.path before any src.* imports are resolved.
# Run the full suite from the repo root with:
#   pytest 01_ocr/tests/ 02_llm_eval/tests/ 03_rag/tests/ -v
# Or run a single module:
#   pytest 03_rag/ -v
testpaths =
    01_ocr/tests
    02_llm_eval/tests
    03_rag/tests
addopts = --tb=short -q
